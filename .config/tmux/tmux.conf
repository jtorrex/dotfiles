##### Terminal & Environment #####
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g allow-passthrough all
set -ga update-environment \
  "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR \
   SSH_AUTH_SOCK DBUS_SESSION_BUS_ADDRESS"

##### Behavior #####
set -s escape-time 0
set -sg repeat-time 600

#### Monitoring & Notifications #####
set -s focus-events on
set -g bell-action none
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

##### Window Management ######
set -g automatic-rename off
set -g base-index 1
set -g pane-base-index 1
set -g set-titles on
set -g display-panes-time 200
set -g renumber-windows on  # Automatically renumber windows when one is closed

# Increase scrollback buffer size to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Prefic key
unbind C-b
set -g prefix C-a
bind a send-keys C-a

# Bind x to kill current pane
bind q kill-pane
bind Q kill-window

# Window and pane creation with current path preservation
unbind '"'
unbind %
bind - split-window -v
bind _ split-window -h

# Enable extended keys (CSI u encoding) for proper modifier key support
# Allows Shift+Enter, Ctrl+Shift+<key>, etc. to work correctly in apps
# NOTE: "always" forces CSI-u sequences to ALL panes (not just those that request it)
# This is required because pi/claude-code don't send the kitty keyboard protocol
# activation sequence. The tradeoff is that fish/zsh need explicit bindings for
# the CSI-u Shift+Enter sequence (see fish conf.d/tmux_keys.fish)
set -g extended-keys always
set -s extended-keys-format csi-u

# Tell tmux the outer terminal supports extended keys
# First `set -s` clears the array (prevents duplicates on reload),
# then `-as` appends additional entries
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys'
set -as terminal-features 'screen*:title'
set -as terminal-features 'rxvt*:ignorefkeys'

#### Configuration
bind e new-window -n "~/.config/tmux/tmux.conf" "sh -c '\${EDITOR:neovim} ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"~/.config/tmux/tmux.conf sourced\"'"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

#### Swap & Resize Panes ####
bind > swap-pane -D
bind < swap-pane -U
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Bind delete key to equalize all panes using tiled layout
bind -r DC select-layout tiled

# Navigation
bind-key -n M-C-l switch-client -p
bind-key -n M-C-h switch-client -n
bind-key -n M-C-k select-window -p
bind-key -n M-C-j select-window -n
bind-key -n M-k select-pane -t :.-
bind-key -n M-j select-pane -t :.+
bind-key -n M-Tab next-window
bind-key -n M-S-Tab previous-window

#### Enable Mouse support
set -g mouse on

#### Copy Mode
tmux_conf_copy_to_os_clipboard=true
bind Enter copy-mode # enter copy mode
bind -T copy-mode-vi v send-keys -X begin-selection           # v to start selection
bind -T copy-mode-vi V send-keys -X select-line               # V to select entire line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy" # y to copy and exit
bind -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle      # Ctrl+v for block selection
bind -T copy-mode-vi q send-keys -X cancel                    # q to exit copy mode
bind -T copy-mode-vi Escape send-keys -X clear-selection      # Escape to clear selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"  # Mouse copy without exiting copy mode
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"     # Mouse copy without exiting copy mode
bind Escape copy-mode

##### Status Bar #####
set-option -g status "on"
set -g status-style fg=colour16,bg=colour34
set -g window-status-current-style fg=colour16,bg=colour160
set -g status-position bottom
set -g status-justify left

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5
set -g status-right-style default
set -g status-right-length 100
set -g status-left-length 100
set -g status-left-style default
set -g status-left "  [#S] "
set -g status-fg black
set -g status-bg green
set -g status-right "| %a %d-%m-%y | %H:%M "
set -g window-status-current-style fg=black
set -g window-status-current-style bg=red
set-window-option -g clock-mode-colour colour109 #blue
