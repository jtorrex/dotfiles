# Light status theme — Gruvbox Light Hard palette (warm cream #f9f5d7,
# softer on the eyes than Catppuccin Latte's near-white #eff1f5).
# Loaded by tmux.conf (if-shell on gsettings) and by .local/bin/toggle-theme
# when the system appearance switches to light.
#
# NOTE: quote every value containing `#`: in config files tmux treats an
# unquoted `#` at the start of a token as a comment ("empty value" error).

# Status bar
set -g status-style "fg=#3c3836,bg=#f9f5d7"
set -g window-status-current-style "fg=#f9f5d7,bg=#076678"
set -g clock-mode-colour "#076678"

# Pane borders
set -g pane-border-style "fg=#928374"
set -g pane-active-border-style "fg=#076678"
