# Light status theme — Catppuccin Latte palette.
# Loaded by tmux.conf (if-shell on gsettings) and by .local/bin/toggle-theme
# when the system appearance switches to light.
#
# NOTE: quote every value containing `#`: in config files tmux treats an
# unquoted `#` at the start of a token as a comment ("empty value" error).

# Status bar
set -g status-style "fg=#4c4f69,bg=#eff1f5"
set -g window-status-current-style "fg=#eff1f5,bg=#1e66f5"
set -g clock-mode-colour "#1e66f5"

# Pane borders
set -g pane-border-style "fg=#9ca0b0"
set -g pane-active-border-style "fg=#1e66f5"
