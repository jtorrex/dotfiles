# Light status theme — GitHub Light Default palette (Primer).
# Full bar uses the dark theme's bg #1e1e2e (Mocha base) in BOTH variants,
# so the bar looks identical in light and dark mode; white text on it.
# Selected window = GitHub red block #cf222e + white text.
# Pane borders keep the shared blue accent (#0969da / dark #89b4fa).
# Matches ghostty's `light:GitHub Light Default` and nvim's
# github_light_default.
# Loaded by tmux.conf (if-shell on gsettings) and by .local/bin/toggle-theme
# when the system appearance switches to light.
#
# NOTE: quote every value containing `#`: in config files tmux treats an
# unquoted `#` at the start of a token as a comment ("empty value" error).

# Status bar — dark bg from the dark theme, same in both modes
set -g status-style "fg=#ffffff,bg=#1e1e2e"
# Current window — GitHub red block
set -g window-status-current-style "fg=#ffffff,bg=#cf222e"
set -g clock-mode-colour "#cf222e"

# Pane borders
set -g pane-border-style "fg=#8c959f"
set -g pane-active-border-style "fg=#0969da"
