# Dark status theme — Catppuccin Mocha palette.
# Full bar = Mocha base #1e1e2e — the same bg the light variant uses, so
# the bar looks identical in both modes; mocha fg on it.
# Selected window = Mocha red block #f38ba8 + ink text.
# Pane borders keep the Mocha blue accent #89b4fa (hue-mate of the light
# theme's GitHub blue #0969da).
# Loaded by tmux.conf (if-shell on gsettings) and by .local/bin/toggle-theme
# when the system appearance switches to dark.
#
# NOTE: quote every value containing `#`: in config files tmux treats an
# unquoted `#` at the start of a token as a comment ("empty value" error).

# Status bar — same dark bg as the light variant
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
# Current window — Mocha red block
set -g window-status-current-style "fg=#1e1e2e,bg=#f38ba8"
set -g clock-mode-colour "#f38ba8"

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
